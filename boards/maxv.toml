# Tarjeta MAX V (CPLD). Pines leídos del esquemático SCH_Schematic1 (diseño nuevo, documentación
# escasa): confirma con la placa antes de fiarte de un pin.
id = "maxv"
name = "MAX V (CPLD)"
family = "MAX V"
device = "5M240ZT144C5N"      # código de pedido (el impreso en el chip y en el esquemático)
quartus_device = "5M240ZT144C5"   # nombre que reconoce Quartus: sin la N final (empaquetado sin plomo)
io_standard = "3.3-V LVTTL"
default_led = "led0"
led_active_low = false       # LED: pin -> LED -> 1k -> GND (enciende con 1)
assignments = [               # pares ["NOMBRE", "valor"] extra para el .qsf
  # Quartus, por defecto, deja los pines sin usar como SALIDAS a tierra: con periféricos o la cabecera de 2x40 conectados,
  # eso es un cortocircuito en potencia. Como entrada en alta impedancia es lo seguro.
  ["RESERVE_ALL_UNUSED_PINS", "AS INPUT TRI-STATED"],
]
sdc_extra = []

[clock]
mhz = 50                     # oscilador de 50 MHz en CLK1 (PIN_20)

[program]
mode = "flash_only"          # solo hay flash interna (CFM): cada carga gasta un ciclo
file = "pof"
limit = 100                  # ciclos garantizados (MAX V Device Handbook, grado comercial)
warn_at = 80

