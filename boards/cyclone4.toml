# Tarjeta Cyclone IV E (FPGA). Pines de "Tabla-de-pines.xlsx" y del esquemático.
id = "cyclone4"
name = "Cyclone IV E (FPGA)"
family = "Cyclone IV E"
device = "EP4CE6E22C8"
quartus_device = "EP4CE6E22C8"    # nombre que reconoce Quartus
io_standard = "3.3-V LVTTL"
default_led = "led1"
led_active_low = true        # LED activo en bajo: enciende con 0
assignments = []
sdc_extra = ["derive_clock_uncertainty"]

[clock]
mhz = 50

[program]
mode = "ram_or_flash"
ram_file = "sof"             # carga por JTAG a la RAM de la FPGA (volátil)
flash_file = "jic"           # JTAG indirecto: se graba la flash de configuración POR EL MISMO CONECTOR JTAG
flash_via = "JTAG"
# Marcadores: {sof} = entrada, {out} = archivo de la flash. `-s` (dispositivo del cargador de flash serial) solo es válido
# al generar .jic: con .pof, Quartus lo rechaza (Error 213025). SIN VERIFICAR la grabación en la placa; prueba con --dry-run.
flash_convert = ["quartus_cpf", "-c", "-d", "EPCS16", "-s", "EP4CE6", "{sof}", "{out}"]
flash_program = ["quartus_pgm", "-m", "jtag", "-o", "p;{out}"]
flash_note = "La flash se graba por JTAG (.jic): el mismo conector que la RAM, no hace falta cambiar el cable."
# Alternativa (modo AS, .pof): pasa el USB-Blaster al conector AS (10 pines) y usa
#   flash_file = "pof";  flash_via = "AS"
#   flash_convert = ["quartus_cpf", "-c", "-d", "EPCS16", "{sof}", "{out}"]      # sin -s
#   flash_program = ["quartus_pgm", "-m", "as", "-o", "p;{out}"]

